name: C9 exact Mult2 functional engineering

on:
  push:
    tags:
      - c9-native-mult2-20261009-01
      - c9-native-mult2-20261009-02

permissions:
  contents: read

concurrency:
  group: c9-native-mult2-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENFHE_COMMIT: df495ba2e91739a6dc8f1de254fc5a41155ce504
  OPENFHE_PREFIX: ${{ github.workspace }}/.ci/openfhe-install
  OMP_NUM_THREADS: '1'
  OMP_THREAD_LIMIT: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  functional:
    if: ${{ github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind clean source and host
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/c9-native
          git rev-parse HEAD > artifacts/c9-native/source-commit.txt
          sw_vers > artifacts/c9-native/os.txt
          sysctl -n machdep.cpu.brand_string hw.memsize > artifacts/c9-native/hardware.txt
          clang++ --version > artifacts/c9-native/compiler.txt
          cmake --version > artifacts/c9-native/cmake.txt
          python3 --version > artifacts/c9-native/python.txt
          cp coordination/c9-native/contract.json artifacts/c9-native/source-contract.json
          cp coordination/c9-native/run_checks.py artifacts/c9-native/run_checks.py
          cp .github/workflows/c9-native-mult2.yml artifacts/c9-native/workflow.yml
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openfheorg/openfhe-development
          ref: df495ba2e91739a6dc8f1de254fc5a41155ce504
          path: .ci/openfhe-src
          submodules: recursive
          persist-credentials: false
      - name: Build pinned static universal OpenFHE
        run: |
          set -euo pipefail
          test "$(git -C .ci/openfhe-src rev-parse HEAD)" = "$OPENFHE_COMMIT"
          git -C .ci/openfhe-src rev-parse HEAD > artifacts/c9-native/openfhe-commit.txt
          brew list --versions boost || brew install boost
          brew list --versions boost > artifacts/c9-native/boost.txt
          cmake -S .ci/openfhe-src -B .ci/openfhe-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$OPENFHE_PREFIX" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS=-Wno-error=unused-variable \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DBUILD_STATIC=ON -DBUILD_SHARED=OFF -DWITH_OPENMP=OFF -DWITH_NATIVEOPT=OFF \
            -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXTRAS=OFF -DNATIVE_SIZE=64 -DMATHBACKEND=4 \
            2>&1 | tee artifacts/c9-native/openfhe-configure.txt
          cmake --build .ci/openfhe-build --parallel 2 2>&1 | tee artifacts/c9-native/openfhe-build.txt
          cmake --install .ci/openfhe-build > artifacts/c9-native/openfhe-install.txt
          cp .ci/openfhe-build/compile_commands.json artifacts/c9-native/openfhe-compile-commands.json
      - name: Build candidate and original API regressions with strict project warnings
        run: |
          set -euo pipefail
          cmake -S . -B .ci/c9-green -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" -DC7_STATIC_BUNDLE=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include" \
            2>&1 | tee artifacts/c9-native/green-configure.txt
          cmake --build .ci/c9-green --parallel 2 --target mult2_backends_test \
            dcp_rcb_test tensor2_test relin2_test rs2_test mult2_test mult2_e2e_oracle_test \
            repeated_mult2_semantic_two_square_test mult2_api_contract_test relin2_api_contract_test \
            rs2_api_contract_test 2>&1 | tee artifacts/c9-native/green-build.txt
          cp .ci/c9-green/compile_commands.json artifacts/c9-native/green-compile-commands.json
      - name: Reproduce the historical trace defect with the new counterexample
        run: |
          set -euo pipefail
          git worktree add --detach .ci/c9-trace-red "$GITHUB_SHA"
          python3 coordination/c9-native/run_checks.py red-source .ci/c9-trace-red artifacts/c9-native
          git -C .ci/c9-trace-red diff > artifacts/c9-native/red-controlled-source.diff
          cmake -S .ci/c9-trace-red -B .ci/c9-red -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" -DC7_STATIC_BUNDLE=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include" \
            2>&1 | tee artifacts/c9-native/red-configure.txt
          cmake --build .ci/c9-red --target mult2_backends_test --parallel 2 \
            2>&1 | tee artifacts/c9-native/red-build.txt
          cp .ci/c9-red/compile_commands.json artifacts/c9-native/red-compile-commands.json
          python3 coordination/c9-native/run_checks.py red .ci/c9-red artifacts/c9-native
      - name: Execute new behavior and the exact 51 original regression cases once
        run: |
          set -euo pipefail
          python3 coordination/c9-native/run_checks.py green .ci/c9-green artifacts/c9-native
          python3 coordination/c9-native/run_checks.py regressions .ci/c9-green artifacts/c9-native
          .ci/c9-green/mult2_api_contract_test
          .ci/c9-green/relin2_api_contract_test
          .ci/c9-green/rs2_api_contract_test
      - name: Witness legal fallback with Wide disabled
        run: |
          set -euo pipefail
          cmake -S . -B .ci/c9-fallback -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" -DC7_STATIC_BUNDLE=ON \
            -DOPENFHE_2023_1788_DISABLE_WIDE_MULT2=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix boost)/include" \
            2>&1 | tee artifacts/c9-native/fallback-configure.txt
          cmake --build .ci/c9-fallback --target mult2_backends_test --parallel 2 \
            2>&1 | tee artifacts/c9-native/fallback-build.txt
          cp .ci/c9-fallback/compile_commands.json artifacts/c9-native/fallback-compile-commands.json
          python3 coordination/c9-native/run_checks.py fallback .ci/c9-fallback artifacts/c9-native
      - name: Preserve portable functional binaries and exact artifact identities
        run: |
          set -euo pipefail
          mkdir -p artifacts/c9-native/bin
          cp .ci/c9-green/mult2_backends_test artifacts/c9-native/bin/mult2_backends_test
          cp .ci/c9-fallback/mult2_backends_test artifacts/c9-native/bin/mult2_backends_fallback_test
          lipo -verify_arch arm64 x86_64 artifacts/c9-native/bin/mult2_backends_test
          lipo -verify_arch arm64 x86_64 artifacts/c9-native/bin/mult2_backends_fallback_test
          otool -L artifacts/c9-native/bin/mult2_backends_test > artifacts/c9-native/linked-libraries.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('artifacts/c9-native')
          files=[{'path':str(f.relative_to(p)),'bytes':f.stat().st_size,
                  'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
                 for f in sorted(p.rglob('*')) if f.is_file()]
          (p/'artifact-manifest.json').write_text(json.dumps({'files':files},indent=2)+'\n')
          PY
      - name: Retain logs and partial evidence after every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c9-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/c9-native/
          if-no-files-found: error
          retention-days: 14
