name: S100 annulus125 one-shot controlled experiment

on:
  push:
    tags:
      - s100-annulus125-once-20260908

permissions:
  contents: read

concurrency:
  group: s100-annulus125-once-${{ github.ref }}
  cancel-in-progress: false

env:
  SCIENCE_BASE: def248a04b7212088e41a72e2239496dcd3e7027
  OPENFHE_COMMIT: df495ba2e91739a6dc8f1de254fc5a41155ce504
  OPENFHE_PREFIX: ${{ github.workspace }}/.ci/openfhe-install
  S100_BUILD: ${{ github.workspace }}/.ci/s100-annulus125-once-build-${{ github.run_id }}-${{ github.run_attempt }}
  S100_EVIDENCE: ${{ github.workspace }}/artifacts/s100-annulus125-once-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  s100-annulus125-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/s100-annulus125-once-20260908' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out exact tag source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize owner-only one-shot evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -- "${GITHUB_WORKSPACE}/artifacts"
          test ! -e "$S100_EVIDENCE" && test ! -L "$S100_EVIDENCE"
          mkdir -- "$S100_EVIDENCE"
          test "$(stat -c '%a' "$S100_EVIDENCE")" = 700

      - name: Set up native Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Repeat one-shot event gate and bind reviewed science source
        shell: bash
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          python_shell="$(command -v python)"
          test "$python_shell" = "$NATIVE_PYTHON"
          "$python_shell" -c 'import os, sys; assert os.name == "posix" and sys.version_info[:2] == (3, 12)'
          "$python_shell" -B coordination/s100-annulus125-20260908/check_one_shot_gate.py ci \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee "$S100_EVIDENCE/event-gate.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'refs/tags/s100-annulus125-once-20260908^{commit}')" = "$GITHUB_SHA"
          git cat-file -e "${SCIENCE_BASE}^{commit}"
          git diff --quiet "$SCIENCE_BASE" "$GITHUB_SHA" -- src include tests CMakeLists.txt
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'project_sha=%s\nscience_base=%s\ntag_ref=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$SCIENCE_BASE" "$GITHUB_REF" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$S100_EVIDENCE/provenance.txt"

      - name: Run synthetic finalizer evidence gate before encryption
        shell: bash
        run: |
          set -euo pipefail
          python -B coordination/s100-annulus125-20260908/check_finalizer.py \
            2>&1 | tee "$S100_EVIDENCE/finalizer-synthetic-gate.log"

      - name: Check out pristine official OpenFHE source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openfheorg/openfhe-development
          ref: df495ba2e91739a6dc8f1de254fc5a41155ce504
          path: .ci/openfhe-src
          submodules: recursive
          persist-credentials: false

      - name: Verify exact clean OpenFHE source and sole official remote
        shell: bash
        run: |
          set -euo pipefail
          git -C .ci/openfhe-src remote set-url origin https://github.com/openfheorg/openfhe-development.git
          test "$(git -C .ci/openfhe-src rev-parse HEAD)" = "$OPENFHE_COMMIT"
          test "$(git -C .ci/openfhe-src remote)" = origin
          test "$(git -C .ci/openfhe-src remote get-url --all origin)" = https://github.com/openfheorg/openfhe-development.git
          test -z "$(git -C .ci/openfhe-src status --porcelain --untracked-files=all)"
          git -C .ci/openfhe-src submodule foreach --quiet --recursive \
            'test -z "$(git status --porcelain --untracked-files=all)"'
          printf 'openfhe_sha=%s\n' "$OPENFHE_COMMIT" >> "$S100_EVIDENCE/provenance.txt"

      - name: Install build dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev

      - name: Record exact toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            cmake --version
            c++ --version
            dpkg-query -W -f='libboost-dev=${Version}\n' libboost-dev
          } > "$S100_EVIDENCE/toolchain-versions.txt" 2>&1

      - name: Restore pristine OpenFHE install cache
        id: cache-openfhe
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci/openfhe-install
          key: openfhe-1.5.0-${{ runner.os }}-gcc-${{ env.OPENFHE_COMMIT }}-native64-backend4

      - name: Record exact OpenFHE cache result
        shell: bash
        env:
          OPENFHE_CACHE_HIT: ${{ steps.cache-openfhe.outputs.cache-hit }}
        run: printf 'openfhe_cache_hit=%s\n' "$OPENFHE_CACHE_HIT" >> "$S100_EVIDENCE/provenance.txt"

      - name: Configure pinned OpenFHE native64 backend4
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cmake -S .ci/openfhe-src -B .ci/openfhe-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${OPENFHE_PREFIX}
          -DBUILD_UNITTESTS=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_BENCHMARKS=OFF
          -DBUILD_EXTRAS=OFF
          -DWITH_OPENMP=ON
          -DNATIVE_SIZE=64
          -DMATHBACKEND=4

      - name: Build and install pinned OpenFHE with two workers
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build .ci/openfhe-build --parallel 2
          cmake --install .ci/openfhe-build

      - name: Configure isolated one-shot candidate build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$S100_BUILD" && test ! -L "$S100_BUILD"
          cmake -S . -B "$S100_BUILD" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DOPENFHE_2023_1788_ENABLE_S100_ANNULUS125=ON \
            2>&1 | tee "$S100_EVIDENCE/project-configure.log"
          test "$(stat -c '%a' "$S100_BUILD")" = 700

      - name: Build only the warning-clean annulus candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$S100_BUILD" \
            --target s100_annulus125_eight_square_test --parallel 2 \
            2>&1 | tee "$S100_EVIDENCE/project-build.log"
          sha256sum "$S100_BUILD/s100_annulus125_eight_square_test" \
            > "$S100_EVIDENCE/binary.sha256"

      - name: Invoke the frozen encrypted sample exactly once
        id: run-once
        timeout-minutes: 22
        shell: bash
        env:
          OMP_NUM_THREADS: 2
        run: |
          set -euo pipefail
          python -B coordination/s100-annulus125-20260908/run_once.py \
            --executable "$S100_BUILD/s100_annulus125_eight_square_test" \
            --result-directory "$S100_EVIDENCE/sample" \
            --source-commit "$GITHUB_SHA"

      - name: Finalize and replay every attempted sample
        if: ${{ always() && steps.run-once.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python -B coordination/s100-annulus125-20260908/finalize_once.py \
            --directory "$S100_EVIDENCE/sample" \
            --source-commit "$GITHUB_SHA" \
            > "$S100_EVIDENCE/finalizer.stdout" \
            2> "$S100_EVIDENCE/finalizer.stderr"

      - name: Archive exact one-shot evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s100-annulus125-once-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.S100_EVIDENCE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
