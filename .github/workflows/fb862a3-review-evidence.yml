name: Exact fb862a3 review evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEWED_COMMIT: fb862a3dfeeb0b79eb8f0e4218749d8a898e96c9
  OPENFHE_COMMIT: df495ba2e91739a6dc8f1de254fc5a41155ce504

jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_COMMIT }}

      - name: Verify reviewed-source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Check out pristine OpenFHE 1.5.0
        uses: actions/checkout@v4
        with:
          repository: openfheorg/openfhe-development
          ref: ${{ env.OPENFHE_COMMIT }}
          path: .ci/openfhe-src
          submodules: recursive

      - name: Verify OpenFHE identity
        shell: bash
        run: |
          test "$(git -C .ci/openfhe-src rev-parse HEAD)" = "$OPENFHE_COMMIT"
          test -z "$(git -C .ci/openfhe-src status --porcelain)"

      - name: Install independent-oracle dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev

      - name: Report toolchain versions
        run: |
          cmake --version
          c++ --version

      - name: Restore pristine OpenFHE install
        id: cache-openfhe
        uses: actions/cache@v4
        with:
          path: .ci/openfhe-install
          key: openfhe-1.5.0-${{ runner.os }}-gcc-${{ env.OPENFHE_COMMIT }}

      - name: Configure pristine OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        run: >-
          cmake -S .ci/openfhe-src -B .ci/openfhe-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/.ci/openfhe-install
          -DBUILD_UNITTESTS=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_BENCHMARKS=OFF
          -DBUILD_EXTRAS=OFF
          -DWITH_OPENMP=ON

      - name: Build and install pristine OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        run: |
          cmake --build .ci/openfhe-build --parallel 2
          cmake --install .ci/openfhe-build

      - name: Configure exact reviewed project
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/.ci/openfhe-install

      - name: Build warning-clean reviewed project
        run: cmake --build build --parallel 2

      - name: Capture complete CTest registration and run unfiltered suite
        run: |
          ctest --test-dir build --show-only=json-v1 | tee ctest-show-only-linux.json
          ctest --test-dir build --output-on-failure

      - name: Retain Linux CTest registration JSON
        uses: actions/upload-artifact@v4
        with:
          name: fb862a3-ctest-json-linux
          path: ctest-show-only-linux.json
          if-no-files-found: error

  windows-mingw64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WINDOWS_ROOT: C:\openfhe-2023-1788-review
      PROJECT_SOURCE: C:\openfhe-2023-1788-review\cleanroom
      OPENFHE_SOURCE: C:\openfhe-2023-1788-review\openfhe-src
      OPENFHE_PREFIX: C:\openfhe-2023-1788-review\openfhe-install
      OPENFHE_BUILD: C:\openfhe-2023-1788-review\openfhe-build
      PROJECT_BUILD: C:\openfhe-2023-1788-review\project-build
    steps:
      - name: Check out exact reviewed source and pristine OpenFHE
        shell: pwsh
        working-directory: C:/
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          New-Item -ItemType Directory -Path $env:WINDOWS_ROOT | Out-Null

          git init $env:PROJECT_SOURCE
          git -C $env:PROJECT_SOURCE remote add origin https://github.com/leemaple/20231788..git
          git -C $env:PROJECT_SOURCE fetch --depth 1 origin $env:REVIEWED_COMMIT
          git -C $env:PROJECT_SOURCE checkout --detach FETCH_HEAD
          if ((git -C $env:PROJECT_SOURCE rev-parse HEAD) -ne $env:REVIEWED_COMMIT) {
            throw "Reviewed-source checkout mismatch"
          }
          if (@(git -C $env:PROJECT_SOURCE status --porcelain).Count -ne 0) {
            throw "Reviewed-source checkout is dirty"
          }

          git init $env:OPENFHE_SOURCE
          git -C $env:OPENFHE_SOURCE remote add origin https://github.com/openfheorg/openfhe-development.git
          git -C $env:OPENFHE_SOURCE fetch --depth 1 origin $env:OPENFHE_COMMIT
          git -C $env:OPENFHE_SOURCE checkout --detach FETCH_HEAD
          git -C $env:OPENFHE_SOURCE submodule update --init --recursive --depth 1
          if ((git -C $env:OPENFHE_SOURCE rev-parse HEAD) -ne $env:OPENFHE_COMMIT) {
            throw "OpenFHE checkout mismatch"
          }
          if (@(git -C $env:OPENFHE_SOURCE status --porcelain).Count -ne 0) {
            throw "OpenFHE checkout is dirty"
          }

      - name: Install official Windows toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            git
            make
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc

      - name: Report toolchain versions
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          cmake --version
          g++ --version

      - name: Restore pristine OpenFHE install
        id: cache-openfhe
        uses: actions/cache@v4
        with:
          path: C:\openfhe-2023-1788-review\openfhe-install
          key: openfhe-1.5.0-${{ runner.os }}-mingw64-${{ env.OPENFHE_COMMIT }}

      - name: Configure pristine OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          source="$(cygpath -u "$OPENFHE_SOURCE")"
          build="$(cygpath -u "$OPENFHE_BUILD")"
          cmake -S "$source" -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_UNITTESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXTRAS=OFF \
            -DWITH_OPENMP=ON

      - name: Build and install pristine OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          build="$(cygpath -u "$OPENFHE_BUILD")"
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          cmake --build "$build" --parallel 2
          cmake --install "$build"

      - name: Configure exact reviewed project
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$prefix"

      - name: Build warning-clean reviewed project
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --parallel 2

      - name: Capture complete CTest registration and run unfiltered suite
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788-review/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --show-only=json-v1 | tee ctest-show-only-windows.json
          ctest --test-dir "$build" --output-on-failure

      - name: Retain Windows CTest registration JSON
        uses: actions/upload-artifact@v4
        with:
          name: fb862a3-ctest-json-windows
          path: C:\openfhe-2023-1788-review\cleanroom\ctest-show-only-windows.json
          if-no-files-found: error
