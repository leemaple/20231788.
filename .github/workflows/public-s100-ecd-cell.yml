name: Public S100 Ecd-cell one-shot adjudication

on:
  push:
    tags:
      - public-s100-ecd-cell-once-20260909

permissions:
  contents: read

concurrency:
  group: public-s100-ecd-cell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-s100-ecd-cell:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/public-s100-ecd-cell-once-20260909' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact tag source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up native Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Initialize unique private evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="${RUNNER_TEMP}/public-s100-ecd-cell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$evidence_dir" && test ! -L "$evidence_dir"
          mkdir -- "$evidence_dir"
          test "$(stat -c '%a' "$evidence_dir")" = 700
          printf 'EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"

      - name: Run scalar-only gate tests and repeat the exact event gate
        shell: bash
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          python_shell="$(command -v python)"
          test "$python_shell" = "$NATIVE_PYTHON"
          "$python_shell" -c 'import os, sys; assert os.name == "posix" and sys.version_info[:2] == (3, 12)'
          "$python_shell" -B coordination/public-s100-ecd-cell-20260909/test_ci_gate.py \
            2>&1 | tee "$EVIDENCE_DIR/ci-gate-tests.log"
          "$python_shell" -B coordination/public-s100-ecd-cell-20260909/check_ci_gate.py ci \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee "$EVIDENCE_DIR/ci-event-gate.json"

      - name: Bind exact source and record limited provenance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          } > "$EVIDENCE_DIR/source-run-provenance.txt"
          python -I -B - <<'PY' > "$EVIDENCE_DIR/python-provenance.txt"
          import json
          import platform
          import sys
          print(json.dumps({
              'executable': sys.executable,
              'implementation': platform.python_implementation(),
              'platform': platform.platform(),
              'version': sys.version,
          }, sort_keys=True))
          PY
          python --version >> "$EVIDENCE_DIR/python-provenance.txt" 2>&1
          sha256sum \
            .github/workflows/public-s100-ecd-cell.yml \
            coordination/public-s100-ecd-cell-20260909/CI_REVIEW.md \
            coordination/public-s100-ecd-cell-20260909/TASK.md \
            coordination/public-s100-ecd-cell-20260909/check_ci_gate.py \
            coordination/public-s100-ecd-cell-20260909/harness_contract.py \
            coordination/public-s100-ecd-cell-20260909/run_once.py \
            coordination/public-s100-ecd-cell-20260909/test_ci_gate.py \
            coordination/public-s100-ecd-cell-20260909/test_harness_contract.py \
            > "$EVIDENCE_DIR/integration-sha256.txt"
          sha256sum \
            coordination/reproduction-adjudication-20260909/pro/MANIFEST.sha256.json \
            > "$EVIDENCE_DIR/pro-manifest-sha256.txt"
          sha256sum \
            coordination/reproduction-adjudication-20260909/pro/candidate/check_rounding.py \
            coordination/reproduction-adjudication-20260909/pro/candidate/interval_core.py \
            coordination/reproduction-adjudication-20260909/pro/candidate/rounding_contract.py \
            coordination/reproduction-adjudication-20260909/pro/tools/run_scalar_checks.py \
            coordination/reproduction-adjudication-20260909/pro/tools/verify_delivery.py \
            coordination/reproduction-adjudication-20260909/pro/tools/verify_input_packet.py \
            coordination/reproduction-adjudication-20260909/pro/tools/verify_rounding_result.py \
            > "$EVIDENCE_DIR/original-pro-source-sha256.txt"

      - name: Run root harness scalar contracts before numerical admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -B coordination/public-s100-ecd-cell-20260909/test_harness_contract.py \
            2>&1 | tee "$EVIDENCE_DIR/harness-contract-tests.log"

      - name: Invoke the reviewed scalar-controls-full-intake harness exactly once
        id: harness
        timeout-minutes: 40
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          set +e
          python -B -I coordination/public-s100-ecd-cell-20260909/run_once.py --reviewed --output-directory "$EVIDENCE_DIR/execution" \
            2>&1 | tee "$EVIDENCE_DIR/harness.log"
          pipeline_status=("${PIPESTATUS[@]}")
          harness_exit=${pipeline_status[0]}
          tee_exit=${pipeline_status[1]}
          set -e
          printf 'harness_exit=%s\n' "$harness_exit" > "$EVIDENCE_DIR/harness.exit"
          printf 'tee_exit=%s\n' "$tee_exit" > "$EVIDENCE_DIR/harness-tee.exit"
          if test "$tee_exit" -ne 0; then
            echo 'Harness log tee failed; numerical outcome is retained but CI evidence is invalid.'
            exit 2
          fi
          exit "$harness_exit"

      - name: Archive only the exact private evidence directory after every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-s100-ecd-cell-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-s100-ecd-cell-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
