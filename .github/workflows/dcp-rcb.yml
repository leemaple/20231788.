      - name: Configure opt-in precision116 eight-square test
        if: github.ref == 'refs/heads/codex/precision116-eight-square-observation-20260907'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")-precision116-eight-square"
          test ! -e "$build"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DOPENFHE_2023_1788_ENABLE_EXPERIMENTAL_PRECISION116_EIGHT_SQUARE=ON

      - name: Build opt-in precision116 eight-square test
        if: github.ref == 'refs/heads/codex/precision116-eight-square-observation-20260907'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")-precision116-eight-square"
          cmake --build "$build" --target experimental_precision116_eight_square_test --parallel 2

