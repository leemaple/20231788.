name: OpenFHE 2023/1788 TDD

on:
  push:
    branches:
      - agent/codex-dcp-rcb-01
      - agent/codex-tensor2-01
      - agent/codex-relin2-01
      - agent/codex-rs2-01
      - codex/mult2-01
      - codex/bv-fixed-key-01
      - codex/integration-01
      - codex/pair-arithmetic-01
      - codex/precision-01
      - codex/pair-mult2-composition-01
      - codex/lossless-io-implementation-01
      - codex/three-track-integration-20260905
      - codex/paper-scale-implementation-20260905
      - codex/endpoint-writer-selftest-20260906
      - codex/endpoint-live-capture-20260906
      - cleanroom/reimplement-mult2-20260831
      - codex/precision116-profile-seam-red-20260907
      - codex/precision116-profile-seam-green-20260907
      - codex/precision116-eight-square-observation-20260907
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENFHE_COMMIT: df495ba2e91739a6dc8f1de254fc5a41155ce504
  OPENFHE_PREFIX: ${{ github.workspace }}/.ci/openfhe-install

jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out clean-room source
        uses: actions/checkout@v4

      - name: Set up endpoint Python 3.12
        id: endpoint-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check out pristine OpenFHE 1.5.0
        uses: actions/checkout@v4
        with:
          repository: openfheorg/openfhe-development
          ref: df495ba2e91739a6dc8f1de254fc5a41155ce504
          path: .ci/openfhe-src
          submodules: recursive

      - name: Verify OpenFHE provenance
        shell: bash
        run: |
          actual="$(git -C .ci/openfhe-src rev-parse HEAD)"
          test "$actual" = "$OPENFHE_COMMIT"
          git -C .ci/openfhe-src status --short

      - name: Install independent-oracle test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev

      - name: Report toolchain versions
        env:
          ENDPOINT_PYTHON_NATIVE: ${{ steps.endpoint-python.outputs.python-path }}
        run: |
          set -euo pipefail
          python_shell="$(command -v python)"
          test "$python_shell" = "$ENDPOINT_PYTHON_NATIVE"
          "$python_shell" -c 'import json, os, sys; sys.exit("native Python 3.12 required") if sys.version_info[:2] != (3, 12) or os.name != "posix" else None; print(json.dumps({"executable": sys.executable, "python": sys.version, "platform": sys.platform}, sort_keys=True))'
          cmake --version
          c++ --version

      - name: Cache pristine OpenFHE install
        id: cache-openfhe
        uses: actions/cache@v4
        with:
          path: .ci/openfhe-install
          key: openfhe-1.5.0-${{ runner.os }}-gcc-${{ env.OPENFHE_COMMIT }}-native64-backend4

      - name: Configure OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        run: >-
          cmake -S .ci/openfhe-src -B .ci/openfhe-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${OPENFHE_PREFIX}
          -DBUILD_UNITTESTS=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_BENCHMARKS=OFF
          -DBUILD_EXTRAS=OFF
          -DWITH_OPENMP=ON
          -DNATIVE_SIZE=64
          -DMATHBACKEND=4

      - name: Build and install OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        run: |
          cmake --build .ci/openfhe-build --parallel 2
          cmake --install .ci/openfhe-build

      - name: Record clean-room run provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'PROJECT_SOURCE_COMMIT=%s GITHUB_RUN_ID=%s GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Configure clean-room project
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH=${OPENFHE_PREFIX}

      - name: Build warning-clean project
        run: cmake --build build --parallel 2

      - name: Build Relin2 public API contract
        run: cmake --build build --target relin2_api_contract_test --parallel 2

      - name: Build RS2 public API contract
        run: cmake --build build --target rs2_api_contract_test --parallel 2

      - name: Run focused first-Mult2 precision contract
        run: |
          cmake --build build --target precision_first_mult2_contract_test --parallel 2
          ctest --test-dir build --verbose --output-on-failure -R '^precision_first_mult2_high_precision_contract$'

      - name: Run focused Pair Add and Sub inputs to first Mult2
        run: ctest --test-dir build --verbose --output-on-failure -R '^mult2_pair_(add|sub)_input_hybrid_complex$'

      - name: Run legacy 57-test checkpoint
        run: |
          ctest --test-dir build --show-only=json-v1 -E '^(precision_client_io_first_mult2_contract|repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract|paper_full_eight_square_contract|experimental_precision116_profile_seam)$'
          ctest --test-dir build --verbose --output-on-failure -E '^(precision_client_io_first_mult2_contract|repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract|paper_full_eight_square_contract|experimental_precision116_profile_seam)$'

      - name: Build Mult2 public API contract
        run: cmake --build build --target mult2_api_contract_test --parallel 2

      - name: Build Add public API contract
        run: cmake --build build --target add_api_contract_test --parallel 2

      - name: Build Sub public API contract
        run: cmake --build build --target sub_api_contract_test --parallel 2

      - name: Build production lossless client I/O contract
        run: cmake --build build --target precision_client_io_first_mult2_contract_test --parallel 2

      - name: Build repeated-Mult2 semantic contract
        run: cmake --build build --target repeated_mult2_semantic_two_square_test --parallel 2

      - name: Build fixed-Q h128 client keypair contract
        run: cmake --build build --target paper_h128_client_keypair_contract_test --parallel 2

      - name: Run focused production lossless client I/O contract
        run: ctest --test-dir build --verbose --output-on-failure -R '^precision_client_io_first_mult2_contract$'

      - name: Run focused repeated-Mult2 and h128 contracts
        run: ctest --test-dir build --verbose --output-on-failure -R '^(repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract)$'

      - name: Run complete 60-test three-track suite
        run: |
          ctest --test-dir build --show-only=json-v1 -E '^(paper_full_eight_square_contract|experimental_precision116_profile_seam)$'
          ctest --test-dir build --verbose --output-on-failure -E '^(paper_full_eight_square_contract|experimental_precision116_profile_seam)$'

      - name: Build paper full eight-square contract
        if: github.ref != 'refs/heads/codex/precision116-eight-square-observation-20260907' && github.ref != 'refs/heads/cleanroom/reimplement-mult2-20260831'
        run: cmake --build build --target paper_full_eight_square_contract_test --parallel 2

      - name: Reject unexpected precision116 RED build success
        if: github.ref == 'refs/heads/codex/precision116-profile-seam-red-20260907'
        run: |
          echo 'Expected missing-factory compile failure was not observed; RED is not established.'
          exit 1

      - name: Run experimental precision116 profile seam once
        if: github.ref == 'refs/heads/codex/precision116-profile-seam-green-20260907'
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: 2
        run: >-
          ctest --test-dir build --verbose --output-on-failure
          --no-tests=error -R '^experimental_precision116_profile_seam$'

      - name: Configure opt-in precision116 eight-square test
        if: github.ref == 'refs/heads/codex/precision116-eight-square-observation-20260907'
        run: |
          build=build-precision116-eight-square
          test ! -e "$build"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" \
            -DOPENFHE_2023_1788_ENABLE_EXPERIMENTAL_PRECISION116_EIGHT_SQUARE=ON

      - name: Build opt-in precision116 eight-square test
        if: github.ref == 'refs/heads/codex/precision116-eight-square-observation-20260907'
        run: |
          build=build-precision116-eight-square
          cmake --build "$build" --target experimental_precision116_eight_square_test --parallel 2

      - name: Run experimental precision116 eight-square observation once
        if: github.ref == 'refs/heads/codex/precision116-eight-square-observation-20260907'
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: 2
        run: |
          build=build-precision116-eight-square
          ctest --test-dir "$build" --verbose --output-on-failure \
            --no-tests=error -R '^experimental_precision116_eight_square_contract$'

      # One-shot draft gate: compile and synthetic observer checks, no paper chain.
      - name: Run draft endpoint observer self-test once
        if: github.ref == 'refs/heads/codex/endpoint-writer-selftest-20260906'
        timeout-minutes: 20
        env:
          OMP_NUM_THREADS: 2
        run: ./build/paper_full_eight_square_contract_test --endpoint-observer-self-test

      - name: Run and finalize paper endpoint once
        id: endpoint-run
        if: github.ref != 'refs/heads/codex/endpoint-writer-selftest-20260906' && github.ref != 'refs/heads/codex/precision116-profile-seam-red-20260907' && github.ref != 'refs/heads/codex/precision116-profile-seam-green-20260907' && github.ref != 'refs/heads/codex/precision116-eight-square-observation-20260907' && github.ref != 'refs/heads/cleanroom/reimplement-mult2-20260831'
        env:
          ENDPOINT_PYTHON_NATIVE: ${{ steps.endpoint-python.outputs.python-path }}
        run: |
          set -euo pipefail
          python_shell="$(command -v python)"
          test "$python_shell" = "$ENDPOINT_PYTHON_NATIVE"
          runner_temp_shell="$(cd "$RUNNER_TEMP" && pwd -P)"
          scratch_shell="$runner_temp_shell/fl"
          test ! -e "$scratch_shell" && test ! -L "$scratch_shell"
          umask 077
          mkdir -- "$scratch_shell"
          scratch_shell="$(cd "$scratch_shell" && pwd -P)"
          bash tests/run_paper_endpoint_once.sh \
            --scope live-single-chain --host linux \
            --build-dir-shell "$PWD/build" \
            --scratch-shell "$scratch_shell" --scratch-native "$scratch_shell" \
            --python "$python_shell" --ctest "$(command -v ctest)"

      - name: Select exact endpoint upload
        id: endpoint-select
        if: ${{ always() && github.ref != 'refs/heads/codex/endpoint-writer-selftest-20260906' && github.ref != 'refs/heads/codex/precision116-profile-seam-red-20260907' && github.ref != 'refs/heads/codex/precision116-profile-seam-green-20260907' && github.ref != 'refs/heads/codex/precision116-eight-square-observation-20260907' && github.ref != 'refs/heads/cleanroom/reimplement-mult2-20260831' }}
        env:
          ENDPOINT_PYTHON_NATIVE: ${{ steps.endpoint-python.outputs.python-path }}
        run: |
          set -euo pipefail
          python_shell="$(command -v python)"
          test "$python_shell" = "$ENDPOINT_PYTHON_NATIVE"
          scratch_shell="$(cd "$RUNNER_TEMP/fl" && pwd -P)"
          manifest_native="$scratch_shell/upload-paths.txt"
          "$python_shell" -B tests/paper_endpoint_finalizer.py select \
            --source-commit "$GITHUB_SHA" --host linux \
            --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --published-parent "$scratch_shell/published" --manifest "$manifest_native"
          {
            echo 'paths<<FS_ENDPOINT_PATHS'
            cat -- "$manifest_native"
            echo 'FS_ENDPOINT_PATHS'
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact endpoint evidence
        if: ${{ always() && steps.endpoint-select.outcome == 'success' && github.ref != 'refs/heads/codex/endpoint-writer-selftest-20260906' && github.ref != 'refs/heads/codex/precision116-profile-seam-red-20260907' && github.ref != 'refs/heads/codex/precision116-profile-seam-green-20260907' && github.ref != 'refs/heads/codex/precision116-eight-square-observation-20260907' && github.ref != 'refs/heads/cleanroom/reimplement-mult2-20260831' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs-residual-endpoint-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.endpoint-select.outputs.paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  windows-mingw64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WINDOWS_ROOT: C:\openfhe-2023-1788
      PROJECT_SOURCE: C:\openfhe-2023-1788\cleanroom
      OPENFHE_SOURCE: C:\openfhe-2023-1788\openfhe-src
      OPENFHE_PREFIX: C:\openfhe-2023-1788\openfhe-install
      OPENFHE_BUILD: C:\openfhe-2023-1788\openfhe-build-${{ github.run_id }}-${{ github.run_attempt }}
      PROJECT_BUILD: C:\openfhe-2023-1788\project-build-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out exact public source commits outside the dotted workspace
        shell: pwsh
        working-directory: C:/
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          New-Item -ItemType Directory -Path $env:WINDOWS_ROOT | Out-Null

          git init $env:PROJECT_SOURCE
          git -C $env:PROJECT_SOURCE remote add origin https://github.com/leemaple/20231788..git
          git -C $env:PROJECT_SOURCE fetch --depth 1 origin $env:GITHUB_SHA
          git -C $env:PROJECT_SOURCE checkout --detach FETCH_HEAD
          $projectActual = git -C $env:PROJECT_SOURCE rev-parse HEAD
          if ($projectActual -ne $env:GITHUB_SHA) {
            throw "Project checkout mismatch: $projectActual"
          }

          git init $env:OPENFHE_SOURCE
          git -C $env:OPENFHE_SOURCE remote add origin https://github.com/openfheorg/openfhe-development.git
          git -C $env:OPENFHE_SOURCE fetch --depth 1 origin $env:OPENFHE_COMMIT
          git -C $env:OPENFHE_SOURCE checkout --detach FETCH_HEAD
          git -C $env:OPENFHE_SOURCE submodule update --init --recursive --depth 1

          $projectStatus = @(git -C $env:PROJECT_SOURCE status --porcelain)
          if ($projectStatus.Count -ne 0) {
            throw "Project checkout is dirty: $($projectStatus -join '; ')"
          }
          $openfheStatus = @(git -C $env:OPENFHE_SOURCE status --porcelain)
          if ($openfheStatus.Count -ne 0) {
            throw "OpenFHE checkout is dirty: $($openfheStatus -join '; ')"
          }

      - name: Set up endpoint Python 3.12
        id: endpoint-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install official Windows toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: false
          path-type: inherit
          install: >-
            git
            make
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc

      - name: Report toolchain versions
        env:
          ENDPOINT_PYTHON_NATIVE: ${{ steps.endpoint-python.outputs.python-path }}
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          set -euo pipefail
          python_shell="$(command -v python)"
          python_native="$(cygpath -am "$python_shell")"
          expected_python_native="$(cygpath -am "$ENDPOINT_PYTHON_NATIVE")"
          test "$python_native" = "$expected_python_native"
          "$python_shell" -c 'import json, os, sys; sys.exit("native Windows Python 3.12 required") if sys.version_info[:2] != (3, 12) or os.name != "nt" else None; print(json.dumps({"executable": sys.executable, "python": sys.version, "platform": sys.platform}, sort_keys=True))'
          printf 'python_shell=%s\npython_native=%s\n' "$python_shell" "$python_native"
          cmake --version
          g++ --version

      - name: Verify OpenFHE provenance
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          source="$(cygpath -u "$OPENFHE_SOURCE")"
          actual="$(git -C "$source" rev-parse HEAD)"
          test "$actual" = "$OPENFHE_COMMIT"
          test -z "$(git -C "$source" status --porcelain)"
          git -C "$source" submodule status --recursive

      - name: Configure OpenFHE
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          source="$(cygpath -u "$OPENFHE_SOURCE")"
          build="$(cygpath -u "$OPENFHE_BUILD")"
          cmake -S "$source" -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_UNITTESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXTRAS=OFF \
            -DWITH_OPENMP=ON \
            -DNATIVE_SIZE=64 \
            -DMATHBACKEND=4

      - name: Build and install OpenFHE
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$OPENFHE_BUILD")"
          cmake --build "$build" --parallel 2
          cmake --install "$build"

      - name: Record clean-room run provenance
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'PROJECT_SOURCE_COMMIT=%s GITHUB_RUN_ID=%s GITHUB_RUN_ATTEMPT=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Configure clean-room project
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$prefix"

      - name: Build warning-clean project
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --parallel 2

      - name: Build Relin2 public API contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target relin2_api_contract_test --parallel 2

      - name: Build RS2 public API contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target rs2_api_contract_test --parallel 2

      - name: Run focused first-Mult2 precision contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          cmake --build "$build" --target precision_first_mult2_contract_test --parallel 2
          ctest --test-dir "$build" --verbose --output-on-failure -R '^precision_first_mult2_high_precision_contract$'

      - name: Run focused Pair Add and Sub inputs to first Mult2
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --verbose --output-on-failure -R '^mult2_pair_(add|sub)_input_hybrid_complex$'

      - name: Run legacy 57-test checkpoint
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --show-only=json-v1 -E '^(precision_client_io_first_mult2_contract|repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract|paper_full_eight_square_contract|experimental_precision116_profile_seam)$'
          ctest --test-dir "$build" --verbose --output-on-failure -E '^(precision_client_io_first_mult2_contract|repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract|paper_full_eight_square_contract|experimental_precision116_profile_seam)$'

      - name: Build Mult2 public API contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target mult2_api_contract_test --parallel 2

      - name: Build Add public API contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target add_api_contract_test --parallel 2

      - name: Build Sub public API contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target sub_api_contract_test --parallel 2

      - name: Build production lossless client I/O contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target precision_client_io_first_mult2_contract_test --parallel 2

      - name: Run focused production lossless client I/O contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --verbose --output-on-failure -R '^precision_client_io_first_mult2_contract$'

      - name: Build repeated-Mult2 semantic contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target repeated_mult2_semantic_two_square_test --parallel 2

      - name: Build fixed-Q h128 client keypair contract
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target paper_h128_client_keypair_contract_test --parallel 2

      - name: Run focused repeated-Mult2 and h128 contracts
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --verbose --output-on-failure -R '^(repeated_mult2_semantic_two_square_contract|paper_h128_client_keypair_contract)$'

      - name: Run complete 60-test three-track suite
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          prefix="$(cygpath -u "$OPENFHE_PREFIX")"
          build="$(cygpath -u "$PROJECT_BUILD")"
          export PATH="$prefix/bin:$prefix/lib:$PATH"
          ctest --test-dir "$build" --show-only=json-v1 -E '^(paper_full_eight_square_contract|experimental_precision116_profile_seam)$'
          ctest --test-dir "$build" --verbose --output-on-failure -E '^(paper_full_eight_square_contract|experimental_precision116_profile_seam)$'

      - name: Build paper full eight-square contract
        if: github.ref != 'refs/heads/codex/precision116-eight-square-observation-20260907' && github.ref != 'refs/heads/cleanroom/reimplement-mult2-20260831'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
        run: |
          build="$(cygpath -u "$PROJECT_BUILD")"
          cmake --build "$build" --target paper_full_eight_square_contract_test --parallel 2

      - name: Reject unexpected precision116 RED build success
        if: github.ref == 'refs/heads/codex/precision116-profile-seam-red-20260907'
        shell: msys2 {0}
        working-directory: C:/openfhe-2023-1788/cleanroom
