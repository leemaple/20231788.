name: S100 annulus125 compile and controls

on:
  push:
    branches:
      - codex/s100-annulus125-20260908
    paths:
      - .github/workflows/s100-annulus125.yml
      - CMakeLists.txt
      - include/openfhe_2023_1788/**
      - src/**
      - tests/**
      - coordination/s100-annulus125-20260908/run_once.py
      - coordination/s100-annulus125-20260908/check_execution_guards.py
      - coordination/s100-annulus125-20260908/replay_annulus125.py
      - coordination/s100-annulus125-20260908/check_receiver_framing.py
      - coordination/s100-annulus125-20260908/scalar_reassessment.py
      - coordination/comprehensive-reassessment-20260908/check_receiver_agreement.py

permissions:
  contents: read

concurrency:
  group: s100-annulus125-compile-controls-${{ github.ref }}
  cancel-in-progress: false

env:
  S100_EXPERIMENT_MODE: compile-controls-only
  OPENFHE_COMMIT: df495ba2e91739a6dc8f1de254fc5a41155ce504
  OPENFHE_PREFIX: ${{ github.workspace }}/.ci/openfhe-install
  S100_BUILD: ${{ github.workspace }}/.ci/s100-annulus125-build-${{ github.run_id }}-${{ github.run_attempt }}
  S100_EVIDENCE: ${{ github.workspace }}/artifacts/s100-annulus125-compile-controls-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  compile-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact project source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize owner-only evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -- "${GITHUB_WORKSPACE}/artifacts"
          test ! -e "$S100_EVIDENCE" && test ! -L "$S100_EVIDENCE"
          mkdir -- "$S100_EVIDENCE"
          test "$(stat -c '%a' "$S100_EVIDENCE")" = 700

      - name: Set up native Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify exact project source and static CI contract
        shell: bash
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/s100-annulus125-20260908
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python_shell="$(command -v python)"
          test "$python_shell" = "$NATIVE_PYTHON"
          "$python_shell" -c 'import os, sys; assert os.name == "posix" and sys.version_info[:2] == (3, 12)'
          "$python_shell" -B coordination/s100-annulus125-20260908/check_execution_guards.py self-test \
            2>&1 | tee "$S100_EVIDENCE/source-guard.log"

      - name: Run synthetic receiver controls only
        shell: bash
        run: |
          set -euo pipefail
          {
            python -B coordination/s100-annulus125-20260908/replay_annulus125.py --self-test
            python -B coordination/s100-annulus125-20260908/check_receiver_framing.py
            python -B coordination/comprehensive-reassessment-20260908/check_receiver_agreement.py \
              coordination/s100-annulus125-20260908/replay_annulus125.py
          } 2>&1 | tee "$S100_EVIDENCE/receiver-controls.log"

      - name: Check out pristine official OpenFHE source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openfheorg/openfhe-development
          ref: df495ba2e91739a6dc8f1de254fc5a41155ce504
          path: .ci/openfhe-src
          submodules: recursive
          persist-credentials: false

      - name: Verify exact clean OpenFHE source and sole official remote
        shell: bash
        run: |
          set -euo pipefail
          git -C .ci/openfhe-src remote set-url origin https://github.com/openfheorg/openfhe-development.git
          test "$(git -C .ci/openfhe-src rev-parse HEAD)" = "$OPENFHE_COMMIT"
          test "$(git -C .ci/openfhe-src remote)" = origin
          test "$(git -C .ci/openfhe-src remote get-url --all origin)" = https://github.com/openfheorg/openfhe-development.git
          test -z "$(git -C .ci/openfhe-src status --porcelain --untracked-files=all)"
          git -C .ci/openfhe-src submodule foreach --quiet --recursive \
            'test -z "$(git status --porcelain --untracked-files=all)"'
          printf 'project_sha=%s\nopenfhe_sha=%s\nmode=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$OPENFHE_COMMIT" "$S100_EXPERIMENT_MODE" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$S100_EVIDENCE/provenance.txt"

      - name: Install build dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev

      - name: Record exact toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            cmake --version
            c++ --version
            dpkg-query -W -f='libboost-dev=${Version}\n' libboost-dev
          } > "$S100_EVIDENCE/toolchain-versions.txt" 2>&1

      - name: Restore pristine OpenFHE install cache
        id: cache-openfhe
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci/openfhe-install
          key: openfhe-1.5.0-${{ runner.os }}-gcc-${{ env.OPENFHE_COMMIT }}-native64-backend4

      - name: Record exact OpenFHE cache result
        shell: bash
        env:
          OPENFHE_CACHE_HIT: ${{ steps.cache-openfhe.outputs.cache-hit }}
        run: printf 'openfhe_cache_hit=%s\n' "$OPENFHE_CACHE_HIT" >> "$S100_EVIDENCE/provenance.txt"

      - name: Configure pinned OpenFHE native64 backend4
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cmake -S .ci/openfhe-src -B .ci/openfhe-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${OPENFHE_PREFIX}
          -DBUILD_UNITTESTS=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_BENCHMARKS=OFF
          -DBUILD_EXTRAS=OFF
          -DWITH_OPENMP=ON
          -DNATIVE_SIZE=64
          -DMATHBACKEND=4

      - name: Build and install pinned OpenFHE with two workers
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build .ci/openfhe-build --parallel 2
          cmake --install .ci/openfhe-build

      - name: Configure isolated annulus opt-in build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$S100_BUILD" && test ! -L "$S100_BUILD"
          cmake -S . -B "$S100_BUILD" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$OPENFHE_PREFIX" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DOPENFHE_2023_1788_ENABLE_S100_ANNULUS125=ON \
            2>&1 | tee "$S100_EVIDENCE/project-configure.log"
          test "$(stat -c '%a' "$S100_BUILD")" = 700

      - name: Build only the warning-clean annulus candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$S100_BUILD" \
            --target s100_annulus125_eight_square_test --parallel 2 \
            2>&1 | tee "$S100_EVIDENCE/project-build.log"

      - name: Show and verify exact CTest selection without running it
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$S100_BUILD" --show-only=json-v1 \
            -R '^s100_annulus125_eight_square_v1$' \
            > "$S100_EVIDENCE/ctest-selection.json"
          python - "$S100_EVIDENCE/ctest-selection.json" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          names = [test["name"] for test in data["tests"]]
          if names != ["s100_annulus125_eight_square_v1"]:
              raise SystemExit(f"unexpected CTest selection: {names!r}")
          PY

      - name: Run direct non-cryptographic controls entry
        timeout-minutes: 5
        shell: bash
        env:
          OMP_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$S100_BUILD/s100_annulus125_eight_square_test" --controls \
            > "$S100_EVIDENCE/controls.stdout" \
            2> "$S100_EVIDENCE/controls.stderr"
          test ! -s "$S100_EVIDENCE/controls.stderr"
          grep -Fx 's100-annulus125-e80-v1 controls=PASS encrypted_runs=0' \
            "$S100_EVIDENCE/controls.stdout"

      - name: Archive compile and controls evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s100-annulus125-compile-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.S100_EVIDENCE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
